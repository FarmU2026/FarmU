<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>How FieldWatch thinks</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* Page-only layout. Colors, type and fonts come from styles.css. */
  header.bar { flex-direction: row; align-items: center; height: 56px; padding: 0 32px; gap: 32px; }
  .bar .how-back { align-self: center; margin-left: auto; font-size: 16px; font-weight: 600; }
  .how { max-width: 1120px; margin: 0 auto; padding: 24px 24px 24px; }
  .how h1 { font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -.01em; }
  .how-lead { color: var(--muted); margin-top: 8px; max-width: 800px; }

  .flow { margin-top: 24px; }
  .node { border: 2px solid var(--line); border-radius: 8px; padding: 12px 16px; background: var(--bg); }
  .node h2, .node-title { font-size: 18px; line-height: 24px; font-weight: 700; margin: 0; }
  .meta { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--muted); margin: 0; }
  .sup { max-width: 680px; margin: 0 auto; border-color: var(--accent); }
  .sup .plain { font-size: 16px; line-height: 22px; margin: 6px 0 0; }
  .stem { width: 2px; height: 24px; margin: 0 auto; background: var(--line); }

  .specs { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding-top: 24px; }
  .specs::after { content: ""; position: absolute; top: 0; height: 2px; background: var(--line);
    left: calc((100% - 32px) / 6); right: calc((100% - 32px) / 6); }
  .spec { position: relative; }
  .spec::before { content: ""; position: absolute; left: 50%; top: -24px; width: 2px; height: 24px; background: var(--line); }

  .tools { list-style: none; margin: 8px 0 0; padding: 0; }
  .tool { padding: 6px 0; border-top: 1px solid var(--line); }
  .tool-label { display: block; font-size: 17px; line-height: 22px; font-weight: 500; }
  .src { display: inline-block; margin-top: 3px; padding: 0 8px; border: 1px solid var(--accent); border-radius: 999px;
    font-size: 14px; line-height: 20px; font-weight: 600; color: var(--accent); }
  .src.gate { border-color: var(--warn); color: var(--warn); }

  .below { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 24px; }
  .note { font-size: 15px; line-height: 22px; color: var(--muted); margin: 8px 0 0; }

  .how-sec { margin-top: 40px; border-top: 1px solid var(--line); padding-top: 20px; }
  .how-sec h2 { font-size: 22px; line-height: 28px; font-weight: 650; margin: 0; }
  .srcs { list-style: none; margin: 8px 0 0; padding: 0; border-bottom: 1px solid var(--line); }
  .srcs li { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.8fr) minmax(0, 1fr); gap: 16px;
    padding: 10px 0; border-top: 1px solid var(--line); align-items: baseline; }
  .srcs .nm { font-size: 16px; line-height: 22px; font-weight: 650; }
  .srcs .gv { font-size: 16px; line-height: 22px; }
  .srcs .up { font-size: 14px; line-height: 20px; color: var(--muted); }

  .how-foot { max-width: 1120px; margin: 0 auto; padding: 16px 24px 40px; font-size: 16px; line-height: 24px; color: var(--muted); }
  .how-foot strong { color: var(--ink); }
  .how-error { color: var(--bad); font-weight: 600; }

  @media (max-width: 760px) {
    header.bar { padding: 0 16px; gap: 16px; }
    .how { padding: 16px 16px 8px; }
    .how h1 { font-size: 28px; line-height: 34px; }
    .flow { margin-top: 16px; }
    .stem, .specs::after, .spec::before { display: none; }
    .specs { grid-template-columns: 1fr; gap: 12px; padding-top: 12px; }
    .below { grid-template-columns: 1fr; }
    .srcs li { grid-template-columns: 1fr; gap: 2px; }
    .how-foot { padding: 16px 16px 40px; }
  }
</style>
</head>
<body>
<header class="bar">
  <span class="wordmark">FieldWatch</span>
  <a class="how-back" href="index.html">Back to the app</a>
</header>

<main class="how">
  <h1>How FieldWatch thinks</h1>
  <p class="how-lead">A supervisor agent sends three specialists to gather evidence. A scorer, not the AI, decides how likely each cause is. Nothing happens on your farm without your YES.</p>
  <div class="flow" id="flow" aria-live="polite"><p class="meta">Loading...</p></div>
  <section class="how-sec" aria-labelledby="sources-h">
    <h2 id="sources-h">Data sources</h2>
    <ul class="srcs" id="sources"></ul>
  </section>
</main>
<footer class="how-foot" id="foot"></footer>

<script src="common.js"></script>
<script src="agents.js"></script>
</body>
</html>
