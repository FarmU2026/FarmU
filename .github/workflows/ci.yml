name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  tests:
    # Offline tests only: no AWS, no network-dependent tests. main must pass with every switch "local".
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            agent/requirements*.txt
            infra/requirements.txt
      # Tests import CDK stacks too (e.g. state machine shape), so install both sets.
      - run: python -m pip install -r requirements-dev.txt -r ../infra/requirements.txt
      - run: python -m pytest tests -q -m "not live"

  cdk-synth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Synth imports agent code (the Gateway schemas come from the tool registry), so install both sets.
      - run: python -m pip install -r requirements.txt -r ../agent/requirements.txt
      - run: npx --yes aws-cdk@2 synth --quiet

  secrets:
    # Catches committed API keys (Bedrock, Twilio, AWS) before they land on main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks *action* needs a paid license for organization repos; the gitleaks CLI is free (MIT).
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect --source /repo --redact -v
