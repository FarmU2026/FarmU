name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # Offline tests only: no AWS, no network-dependent tests. main must pass with every switch "local".
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests -q -m "not live"

  cdk-synth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -r requirements.txt
      - run: npx --yes aws-cdk@2 synth --quiet

  secrets:
    # Catches committed API keys (Bedrock, Twilio, AWS) before they land on main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
