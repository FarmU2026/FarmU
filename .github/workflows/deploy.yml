name: deploy

# Deploys the CDK app from main, or on demand. Uses the fieldwatch-github-deploy role through the
# account's existing GitHub OIDC provider. Set these repository variables (Settings > Secrets and
# variables > Actions > Variables), never in code:
#   AWS_DEPLOY_ROLE_ARN   arn of fieldwatch-github-deploy
#   AWS_REGION            us-west-2

on:
  workflow_dispatch:
    inputs:
      stacks:
        description: "Stacks to deploy (space-separated), or --all"
        default: "--all"
  push:
    branches: [main]
    paths: ["infra/**", "agent/fieldwatch/**", "agent/cloud/**"]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  cdk:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: deploy
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # Synth imports agent code (Gateway schemas come from the tool registry).
      - run: python -m pip install -r requirements.txt -r ../agent/requirements.txt
      - run: npx --yes aws-cdk@2 deploy ${{ github.event.inputs.stacks || '--all' }} --require-approval never
